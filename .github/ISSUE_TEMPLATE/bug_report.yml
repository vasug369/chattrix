name: Bug report
description: Something does not work as expected
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. Use **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sign-in / account
        - Feed / posts
        - Profile / people
        - Messages
        - Notifications
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android, Chrome 130
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Remove any personal data first.
